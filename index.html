<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>English Casino</title><style>
*{box-sizing:border-box}body{margin:0;background:#102c28;color:#f8f5e9;font:17px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}h1{letter-spacing:.08em;color:#f4d58b;margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:#193d36;border:1px solid #507369;border-radius:18px;padding:24px;margin-top:18px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #c5b27e;border-radius:10px;padding:12px 18px;background:#f4d58b;color:#172d26;font-weight:700}button:disabled{opacity:.45;cursor:default}button.secondary{background:transparent;color:#f8f5e9}input{width:100%;padding:14px;border-radius:10px;border:1px solid #a5b8ad;background:#fff;color:#172d26;margin:12px 0} .row{display:flex;gap:10px;flex-wrap:wrap}.bets button{flex:1;min-width:100px}.muted{color:#c3d5cc;font-size:14px}.jp{font-size:24px;font-weight:700;line-height:1.6}.answer{font-size:21px;color:#f4d58b;overflow-wrap:anywhere}#score{font-size:28px;color:#f4d58b;font-weight:bold}progress{width:100%;accent-color:#e6c779} [hidden]{display:none!important} .wrong{color:#ffb8ab}.good{color:#b6f3c4}li{margin:12px 0}  .bets button{min-width:145px}.selected{outline:3px solid white}.tile{margin:4px;padding:9px}.prompt{font-size:21px;line-height:1.8}#built{min-height:60px;border:1px solid #78998b;padding:12px;border-radius:8px} </style></head><body><main><header><h1>ENGLISH CASINO</h1><div>SCORE <span id="score">0</span> pt</div></header><section id="start" class="panel"><h2>何点に挑戦する？</h2><p>30点：ヒントなし英訳 ／ 15点：語彙ヒントあり ／ 10点：穴埋め ／ 5点：並べ替え</p><p>正解で加点、不正解で減点。難しければ低い点数に変更できます。一度見たヒントは取り消せません。</p><label>問題数 <select id="count"><option>10</option><option>20</option><option>33</option></select></label> <button id="begin">START</button></section><section id="game" class="panel" hidden><div id="round"></div><progress id="progress"></progress><p class="jp" id="jp"></p><div class="row bets" id="modes"><button data-mode="30">30点 英訳</button><button data-mode="15">15点 ヒント</button><button data-mode="10">10点 穴埋め</button><button data-mode="5">5点 並べ替え</button></div><p id="prompt" class="prompt"></p><div id="typing"><input id="entry" autocomplete="off" spellcheck="false" aria-label="解答"></div><div id="sorting" hidden><div id="built"></div><div id="tiles"></div><button id="undo" class="secondary">1語戻す</button> <button id="reset" class="secondary">並べ直す</button></div><p><button id="submit">解答する</button></p><p id="msg" role="status"></p><div id="feedback" hidden><hr><div class="muted">あなたの解答</div><p id="mine"></p><div class="muted">模範解答</div><p id="answer" class="answer"></p><p id="note"></p><p id="alts"></p><p class="muted">登録済み別解との照合です。未登録の正しい別解は判定できない場合があります。</p><button id="next">次の問題</button></div></section><section id="end" class="panel" hidden><h2>RESULT</h2><p id="result" class="answer"></p><h3>復習する問題</h3><ol id="review"></ol><button id="again">もう一度挑戦</button></section></main><script>const bank=[{"jp": "医者は私に食べすぎないよう忠告した。", "h": "doctor / eat / too much", "a": ["The doctor advised me not to eat too much.", "The doctor advised me not to overeat."], "n": "advise + 人 + not to do", "b": "advised me not to eat"}, {"jp": "君は明日までに宿題をしてしまうべきだ。", "h": "homework / by tomorrow", "a": ["You should have your homework done by tomorrow.", "You ought to have your homework done by tomorrow."], "n": "have + O + 過去分詞：完了した状態", "b": "have your homework done"}, {"jp": "ボブは泥棒がその家から出てくるのを見た。", "h": "Bob / thief / house / come out of", "a": ["Bob saw a thief coming out of the house.", "Bob saw a thief come out of the house."], "n": "see + O + 原形 / 現在分詞", "b": "saw a thief coming"}, {"jp": "彼はそのスターからの手紙を私に読ませてくれた。", "h": "letter / star / read", "a": ["He let me read the letter from the star.", "He let me read the letter from that star."], "n": "let + O + 原形", "b": "let me read"}, {"jp": "久美は友達に一緒に旅行に行くよう説得した。", "h": "Kumi / friends / trip", "a": ["Kumi persuaded her friends to go on a trip with her.", "Kumi persuaded her friends to take a trip with her."], "n": "persuade + O + to do", "b": "persuaded her friends to go"}, {"jp": "問題は，そのような人混みの中でお互いを見つけられるかどうかだ。", "h": "problem / find each other / crowd", "a": ["The problem is whether we can find each other in such a crowd.", "The problem is whether we can find one another in such a crowd."], "n": "whether + 主語 + 動詞", "b": "whether we can find"}, {"jp": "飛行機のチケットが手に入るのだろうか。", "h": "I wonder / get / plane ticket", "a": ["I wonder if I can get a plane ticket.", "I wonder whether I can get a plane ticket.", "I wonder if I can get an airline ticket.", "I wonder whether I can get an airline ticket."], "n": "wonder if + 主語 + 動詞", "b": "if I can get"}, {"jp": "この前の日曜日に，私の姉は一日中寝ていた。", "h": "last Sunday / sister / sleep / all day", "a": ["Last Sunday, my sister kept sleeping all day.", "My sister kept sleeping all day last Sunday.", "Last Sunday, my older sister kept sleeping all day."], "n": "keep + 動詞のing形", "b": "kept sleeping"}, {"jp": "村人たちはその旅行者たちを友達だと思っていた。", "h": "villagers / travelers / friends", "a": ["The villagers regarded the travelers as their friends.", "The villagers regarded the travellers as their friends."], "n": "regard A as B", "b": "regarded the travelers as"}, {"jp": "彼らは台風で家の屋根を吹き飛ばされた。", "h": "roof / house / typhoon / blow away", "a": ["They had the roof of their house blown away by the typhoon.", "They had the roof of their home blown away by the typhoon."], "n": "have + O + 過去分詞：被害", "b": "had the roof of their house blown away"}, {"jp": "部屋の掃除が女性の仕事だと考えられるべきではない。", "h": "cleaning rooms / woman / job", "a": ["Cleaning rooms should not be thought of as a woman’s job.", "Cleaning rooms should not be thought of as a job for women."], "n": "think of A as B の受動態", "b": "should not be thought of as"}, {"jp": "ボタンを押すだけでいいんだよ。", "h": "button / push", "a": ["All you have to do is to push the button.", "All you have to do is push the button.", "All you have to do is press the button.", "All you have to do is to press the button."], "n": "All you have to do is (to) do", "b": "is to push"}, {"jp": "先生は私たちに，よい本をたくさん読んでもらいたいと思っている。", "h": "teacher / many / good books", "a": ["The teacher wants us to read a lot of good books.", "The teacher wants us to read many good books.", "The teacher wants us to read lots of good books."], "n": "want + O + to do", "b": "wants us to read"}, {"jp": "彼の目標はオリンピックで金メダルをとることだった。", "h": "goal / win / gold medal / Olympics", "a": ["His goal was to win a gold medal at the Olympics.", "His goal was to win a gold medal in the Olympics."], "n": "to不定詞が補語", "b": "was to win"}, {"jp": "お年寄りが私に，バス停がどこにあるか聞いた。", "h": "old man / bus stop", "a": ["An old man asked me where the bus stop was.", "An elderly man asked me where the bus stop was."], "n": "間接疑問：where + 主語 + 動詞", "b": "where the bus stop was"}, {"jp": "私の息子はそのテレビゲームに退屈しているように見えた。", "h": "son / video game / bored", "a": ["My son seemed bored with the video game.", "My son seemed bored with that video game."], "n": "seem + 形容詞、bored with", "b": "seemed bored with"}, {"jp": "彼の息子は疲れて，すぐに眠ってしまった。", "h": "son / tired / soon / asleep", "a": ["His son got tired and soon fell asleep.", "His son became tired and soon fell asleep."], "n": "get tired / fall asleep", "b": "got tired and soon fell asleep"}, {"jp": "あの髪の長い女性が私に道を教えてくれました。", "h": "woman / long hair / way", "a": ["That woman with long hair showed me the way.", "That long-haired woman showed me the way."], "n": "show + 人 + 物", "b": "showed me the way"}, {"jp": "コーチは昨日，私たちに5時間練習させた。", "h": "coach / practice / five hours / yesterday", "a": ["Our coach made us practice for five hours yesterday.", "Yesterday, our coach made us practice for five hours.", "Our coach made us practise for five hours yesterday."], "n": "make + O + 原形", "b": "made us practice"}, {"jp": "私は彼が仕事の不満を言うのを聞いたことがない。", "h": "never / complain / job", "a": ["I have never heard him complain about his job.", "I have never heard him complain about his work."], "n": "hear + O + 原形", "b": "heard him complain"}, {"jp": "父は弟がアメリカへ旅行に行くのを許した。", "h": "father / younger brother / America / travel", "a": ["My father allowed my younger brother to travel to America.", "My father allowed my younger brother to take a trip to the United States."], "n": "allow + O + to do", "b": "allowed my younger brother to travel"}, {"jp": "私は父にいつ帰宅するかたずねた。", "h": "father / come home", "a": ["I asked my father when he would come home.", "I asked my father when he would return home."], "n": "間接疑問：when + 主語 + 動詞", "b": "when he would come home"}, {"jp": "生徒たちはその映画に興奮した。", "h": "students / movie / excited", "a": ["The students got excited about the movie.", "The students got excited about the film."], "n": "get excited about", "b": "got excited about"}, {"jp": "本当はビルが私のスマホを壊したのだ。", "h": "Bill / smartphone / break", "a": ["The truth is that Bill broke my smartphone.", "The truth is that Bill broke my mobile phone."], "n": "The truth is that ...", "b": "is that Bill broke"}, {"jp": "急いで行ったが，その店は閉まっていた。", "h": "hurry / shop / closed", "a": ["I hurried to the shop, but I found it closed.", "I hurried to the store, but I found it closed."], "n": "find + O + 補語", "b": "found it closed"}, {"jp": "父は洋服屋にスーツを作ってもらった。", "h": "my father / tailor / suit", "a": ["My father had a tailor make a suit.", "My father had a tailor make him a suit."], "n": "have + 人 + 原形", "b": "had a tailor make"}, {"jp": "私たちは，ボブがよいコーチだと思っている。", "h": "Bob / good coach", "a": ["We believe Bob to be a good coach.", "We believe Bob to be a fine coach."], "n": "believe + O + to be", "b": "believe Bob to be"}, {"jp": "フェンスを塗りなおしてもらわなくてはならない。", "h": "fence / repaint", "a": ["We have to have the fence repainted.", "We need to have the fence repainted."], "n": "have + O + 過去分詞", "b": "have to have the fence repainted"}, {"jp": "翔太の携帯電話がかばんの中で鳴っているのが聞こえた。", "h": "Shota / cell phone / ring / bag", "a": ["I heard Shota’s cell phone ringing in his bag.", "I heard Shota’s mobile phone ringing in his bag.", "I heard Shota’s phone ringing in his bag."], "n": "hear + O + 現在分詞", "b": "heard Shota’s cell phone ringing"}, {"jp": "その赤ちゃんは3時間泣き続けました。", "h": "baby / cry / three hours", "a": ["The baby kept crying for three hours.", "The baby kept crying for 3 hours."], "n": "keep + 動詞のing形", "b": "kept crying"}, {"jp": "その部屋はとても騒がしかったので，自分の名前が呼ばれるのが聞こえなかった。", "h": "room / noisy / name / call", "a": ["The room was so noisy that I couldn’t hear my name called.", "The room was so noisy that I could not hear my name being called."], "n": "so ... that / hear + O + 過去分詞", "b": "hear my name called"}, {"jp": "太郎はフランス語を話せるのだろうか。", "h": "Taro / French / speak", "a": ["I wonder if Taro can speak French.", "I wonder whether Taro can speak French."], "n": "wonder if + 主語 + 動詞", "b": "if Taro can speak"}, {"jp": "私の仕事は高いビルの窓をきれいにすることだ。", "h": "job / clean / windows / tall buildings", "a": ["My job is to clean the windows of tall buildings.", "My job is to clean the windows of high-rise buildings."], "n": "to不定詞が補語", "b": "is to clean"}];
const $=id=>document.getElementById(id);let deck=[],i=0,score=0,correct=0,miss=[],mode=30,locked=false,tiles=[],chosen=[];
function norm(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/\bcan't\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not').replace(/\b(i|we|they|you)'ve\b/g,'$1 have').replace(/\b(i|he|she|we|they|you)'d\b/g,'$1 would').replace(/\b(i)'m\b/g,'$1 am').replace(/[.,!?。]/g,'').replace(/\s+/g,' ').trim()}
function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function renderTiles(){$('built').textContent=chosen.map(k=>tiles[k]).join(' ')||'語句を順番に選んでください';$('tiles').replaceChildren();tiles.forEach((w,k)=>{let b=document.createElement('button');b.className='tile';b.textContent=w;b.disabled=locked||chosen.includes(k);b.onclick=()=>{chosen.push(k);renderTiles()};$('tiles').append(b)});$('undo').disabled=locked||!chosen.length;$('reset').disabled=locked||!chosen.length}
function selectMode(m){if(locked||m>mode)return;mode=m;let q=deck[i];document.querySelectorAll('[data-mode]').forEach(b=>{b.disabled=+b.dataset.mode>mode;b.classList.toggle('selected',+b.dataset.mode===mode)});$('entry').value='';$('typing').hidden=m===5;$('sorting').hidden=m!==5;$('prompt').textContent=m===15?'語彙ヒント：'+q.h:m===10?q.a[0].replace(q.b,'( '+q.b.split(' ').map(()=> '＿＿').join(' ')+' )'):m===5?'語句を並べ替えて英文を完成させよう。':'英文を入力してください。';$('entry').placeholder=m===10?'空欄の語句を順に入力':'英文を入力';if(m===5){tiles=shuffle(q.a[0].replace(/[.!?]+$/, '').replace(/^([A-Z])/, c=>c.toLowerCase()).split(/\s+/));chosen=[];renderTiles()}else $('entry').focus()}
function show(){locked=false;mode=30;$('round').textContent=`ROUND ${i+1} / ${deck.length}`;$('progress').max=deck.length;$('progress').value=i;$('jp').textContent=deck[i].jp;$('feedback').hidden=true;$('msg').textContent='';$('submit').disabled=false;$('entry').disabled=false;selectMode(30)}
$('begin').onclick=()=>{deck=shuffle([...bank]).slice(0,+$('count').value);i=score=correct=0;miss=[];$('score').textContent=0;$('start').hidden=true;$('end').hidden=true;$('game').hidden=false;show()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>selectMode(+b.dataset.mode));$('undo').onclick=()=>{chosen.pop();renderTiles()};$('reset').onclick=()=>{chosen=[];renderTiles()};
$('submit').onclick=()=>{if(locked)return;let q=deck[i],v=mode===5?chosen.map(k=>tiles[k]).join(' '):$('entry').value.trim();if(!v||(mode===5&&chosen.length!==tiles.length)){$('msg').textContent='解答を完成させてください。';return}let full=mode===10?q.a[0].replace(q.b,()=>v):v;let idx=q.a.findIndex(a=>norm(a)===norm(full));let ok=idx>=0;locked=true;score+=ok?mode:-mode;if(ok)correct++;else miss.push({q,v:full});$('score').textContent=score;$('msg').className=ok?'good':'wrong';$('msg').textContent=ok?`正解！${idx>0?'（別解）':''} +${mode} pt`:`登録解答と不一致 −${mode} pt`;$('mine').textContent=full;$('answer').textContent=q.a[0];$('note').textContent=q.n;$('alts').textContent=q.a.length>1?'登録別解：'+q.a.slice(1).join(' ／ '):'';$('entry').disabled=true;$('submit').disabled=true;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=true);if(mode===5)renderTiles();$('feedback').hidden=false;$('next').textContent=i===deck.length-1?'結果を見る':'次の問題'};
$('entry').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});$('next').onclick=()=>{if(!locked)return;if(++i<deck.length){show();return}$('game').hidden=true;$('end').hidden=false;$('result').textContent=`${score} pt · ${correct} / ${deck.length} 問正解`;$('review').replaceChildren();for(let {q,v} of miss){let li=document.createElement('li');li.textContent=q.jp+' ／ あなたの解答：'+v+' ／ 模範解答：'+q.a[0]+' ／ '+q.n;$('review').append(li)}if(!miss.length)$('review').textContent='全問正解！'};$('again').onclick=()=>{$('end').hidden=true;$('start').hidden=false;$('score').textContent=0};</script></body></html>
